<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pengurusan Farmasi</title>
<style>
  :root { --navy: #0b2545; --accent: #0e9f8f; --muted: #5d6b7e; --bg: #f4f6f9; }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--navy);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    max-width: 520px; width: 100%; background: #fff; border-radius: 14px; padding: 40px;
    border-top: 6px solid var(--accent); box-shadow: 0 10px 30px rgba(11,37,69,.08);
  }
  .tag { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  h1 { font-size: 30px; margin: 12px 0 10px; }
  p { color: var(--muted); line-height: 1.5; }
</style>
</head>
<body>
  <main class="card">
    <div class="tag">Halaman Ujian</div>
    <h1>Pengurusan Farmasi</h1>
    <p>Halaman ini berfungsi. Ini ialah halaman ujian bagi repositori <b>pengurusan-farmasi</b>.</p>
  </main>
</body>
</html>
